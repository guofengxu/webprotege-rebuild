spring:
  application:
    name: webprotege-rebuild
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: ${wp.upload.max-size}
      max-request-size: ${wp.upload.max-size}
  # SpaFallbackConfiguration registers the only /** resource handler.
  web:
    resources:
      add-mappings: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wp}
    username: ${SPRING_DATASOURCE_USERNAME:wp}
    password: ${SPRING_DATASOURCE_PASSWORD:wp}
springdoc:
  writer-with-order-by-keys: true
wp:
  data-dir: data
  project:
    ontology-iri-base: http://example.org/wp/
  upload:
    max-size: 200MB
  tokens:
    access-ttl: 12h
    refresh-ttl: 30d
  cors:
    allowed-origins: []
  mcp:
    max-result-bytes: 262144
