services:
  postgres:
    image: postgres:18
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: wp
      POSTGRES_USER: wp
      POSTGRES_PASSWORD: wp
    volumes:
      - wp-pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wp -d wp"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wp
      SPRING_DATASOURCE_USERNAME: wp
      SPRING_DATASOURCE_PASSWORD: wp
      WP_DATA_DIR: /app/data
      WP_BOOTSTRAP_ADMIN_USERNAME: ${WP_BOOTSTRAP_ADMIN_USERNAME:-admin}
      WP_BOOTSTRAP_ADMIN_PASSWORD: ${WP_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      WP_BOOTSTRAP_ADMIN_EMAIL: ${WP_BOOTSTRAP_ADMIN_EMAIL:-admin@localhost}
    volumes:
      - wp-app-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /api/auth/me HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && cat <&3 | head -1 | grep -Eq \"401|200\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "0.0.0.0:8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  wp-pg-data:
  wp-app-data:
