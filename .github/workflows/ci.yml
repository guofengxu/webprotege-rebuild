# 每个 PR 与 main 上的 push 都跑本工作流。不要在 on.pull_request 上加 paths：
# 被路径过滤掉的工作流不会上报状态，分支保护会一直等待。按端跳过放在 job 的 if 上，
# 由 ci-gate 统一上报。后续卡片新增的 job（例如 frontend）必须加入 ci-gate 的 needs。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BASE_REF" ]; then
            echo "pull_request is missing the base ref; refusing to skip the backend job" >&2
            exit 1
          fi
          git fetch --no-tags origin "$BASE_REF"
          diff_out="$(mktemp)"
          # --no-renames 保留旧路径。否则移出 backend/ 的重命名只显示新路径，java 会被跳过。
          git diff --name-only --no-renames "origin/${BASE_REF}...HEAD" > "$diff_out"
          backend=false
          frontend=false
          while IFS= read -r path || [ -n "$path" ]; do
            [ -z "$path" ] && continue
            case "$path" in
              backend/*|pom.xml|.mvn/*|mvnw|mvnw.cmd|testdata/*|docs/api/openapi.json|.github/workflows/*)
                backend=true
                ;;
            esac
            case "$path" in
              frontend/*|docs/api/openapi.json)
                frontend=true
                ;;
            esac
            if [ "$backend" = true ] && [ "$frontend" = true ]; then
              break
            fi
          done < "$diff_out"
          echo "backend=${backend}" >> "$GITHUB_OUTPUT"
          echo "frontend=${frontend}" >> "$GITHUB_OUTPUT"
          echo "backend=${backend}"
          echo "frontend=${frontend}"

  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check task cards and index
        run: python tools/plan_lint.py --check --check-index
      - name: Validate branch name and commit messages
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_REF" ] || [ -z "$HEAD_REF" ]; then
            echo "pull_request is missing the base or head ref" >&2
            exit 1
          fi
          script=".cursor/skills/git-naming-conventions/scripts/validate_names.py"
          python "$script" --branch "$HEAD_REF"
          git fetch --no-tags origin "$BASE_REF"
          range="origin/${BASE_REF}..HEAD"
          # 与 validate_names.py 的 TASK_BRANCH_RE 一致：任务卡分支要求人工确认尾注。
          task_branch_re='^(feature|fix|test|refactor|docs|chore)/p[0-9]-[0-9]{2}-[a-z0-9]+(-[a-z0-9]+)*$'
          if [[ "$HEAD_REF" =~ $task_branch_re ]]; then
            python "$script" --range "$range" --require-trailers
          else
            python "$script" --range "$range"
          fi

  java:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify
        run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/**"
          if-no-files-found: ignore

  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm -C frontend install --frozen-lockfile
      - name: Check generated API types
        run: pnpm -C frontend --filter @wp/api-types run check

  ci-gate:
    needs: [changes, plan, java, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a needed job failed or was cancelled
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          JAVA_RESULT: ${{ needs.java.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          set -euo pipefail
          fail=0
          for pair in "changes=${CHANGES_RESULT}" "plan=${PLAN_RESULT}" "java=${JAVA_RESULT}" "frontend=${FRONTEND_RESULT}"; do
            name="${pair%%=*}"
            result="${pair#*=}"
            echo "${name}: ${result}"
            case "$result" in
              success|skipped)
                ;;
              *)
                fail=1
                ;;
            esac
          done
          exit "$fail"
